# Flatpak manifest for Proton IP Scanner.
#
# This is the manifest submitted to Flathub (github.com/flathub/org.protonos.ProtonIpScanner).
# It builds the app from a tagged release of this repository, entirely offline: every Rust
# crate is listed with its checksum in cargo-sources.json (Flathub's builders have no internet).
#
# After a new release: update `tag` and `commit` below, and if Cargo.lock changed, regenerate
# cargo-sources.json (see docs/FLATPAK.md). CI builds this manifest on every push and fails
# when cargo-sources.json no longer matches Cargo.lock.
app-id: org.protonos.ProtonIpScanner
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  # Rust compiler (the app needs Rust 1.95 or newer).
  - org.freedesktop.Sdk.Extension.rust-stable
command: proton-ip-scanner

finish-args:
  # Scanning, ping, name lookups (DNS, mDNS, NetBIOS, LLMNR, UPnP) and the online CVE lookups.
  # Sharing the network also lets the app read /proc/net/arp for MAC addresses. No root is
  # needed: ping uses the kernel's unprivileged ICMP sockets, with TCP and ARP as fallbacks.
  - --share=network
  # The window: Wayland, or X11 where Wayland isn't available; X11 needs shared IPC.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL rendering (egui/glow).
  - --device=dri
  # Excel, PDF, CSV and HTML reports are saved in the user's Documents folder, and an offline
  # CVE database file is exported there.
  - --filesystem=xdg-documents
  # An offline CVE database file copied from another computer can also be imported from the
  # Downloads folder (read only).
  - --filesystem=xdg-download:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # Use only the vendored crates from cargo-sources.json.
    CARGO_HOME: /run/build/proton-ip-scanner/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: proton-ip-scanner
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/proton-ip-scanner /app/bin/proton-ip-scanner
      # Flatpak only exports files named after the app ID, so the desktop entry and icon are
      # installed under that name and the desktop entry's Icon= is pointed at it.
      - install -Dm644 packaging/org.protonos.ProtonIpScanner.desktop /app/share/applications/org.protonos.ProtonIpScanner.desktop
      - desktop-file-edit --set-icon=org.protonos.ProtonIpScanner /app/share/applications/org.protonos.ProtonIpScanner.desktop
      - install -Dm644 assets/proton-ip-scanner.svg /app/share/icons/hicolor/scalable/apps/org.protonos.ProtonIpScanner.svg
      - install -Dm644 packaging/org.protonos.ProtonIpScanner.metainfo.xml /app/share/metainfo/org.protonos.ProtonIpScanner.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/org.protonos.ProtonIpScanner/LICENSE
      - install -Dm644 data/oui-data-LICENSE.txt /app/share/licenses/org.protonos.ProtonIpScanner/oui-data-LICENSE.txt
    sources:
      - type: git
        url: https://github.com/ProtonOS-Linux/proton-network-scanner.git
        tag: v1.3.1
        commit: COMMIT_OF_V1.3.1
      - cargo-sources.json
