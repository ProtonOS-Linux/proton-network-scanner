# Tests every push and pull request on Linux and Windows. When a version tag
# (v1.3.0, …) is pushed, it also builds the release files and attaches them to a
# GitHub release:
#
#   proton-ip-scanner_<version>-1_amd64.deb          Debian/Ubuntu package (glibc 2.30+)
#   proton-ip-scanner-<version>-linux-x86_64.tar.gz  plain Linux binary
#   ProtonIPScanner-<version>-Setup.exe              Windows installer
#   proton-ip-scanner-<version>-windows-portable.exe Windows, no installation
#   SHA256SUMS.txt
#
# The Proton OS APT repository (github.com/ProtonOS-Linux/apt) picks up the .deb
# from the release within an hour, so Proton OS computers get the update through
# KDE Discover / apt.
#
# Optional Windows code signing (removes the SmartScreen "unknown publisher"
# warning once the certificate has reputation): add the repository secrets
# WINDOWS_CERT_PFX (base64 of a .pfx code-signing certificate) and
# WINDOWS_CERT_PASSWORD. Without them, the files are built unsigned.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Tools
        run: |
          pip install ziglang
          cargo install cargo-zigbuild cargo-deb --locked
      - name: Build against glibc 2.30 (runs on Debian 11+, Ubuntu 20.04+)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
      - name: Package
        run: |
          set -eu
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo deb --target x86_64-unknown-linux-gnu --no-build
          mkdir -p out
          cp target/debian/*.deb out/ 2>/dev/null || cp target/x86_64-unknown-linux-gnu/debian/*.deb out/
          tar -C target/x86_64-unknown-linux-gnu/release -czf "out/proton-ip-scanner-$v-linux-x86_64.tar.gz" proton-ip-scanner
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit]
    runs-on: windows-latest
    env:
      # Secrets cannot be used in `if:` directly; expose only whether one exists.
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Sign the program (optional)
        if: env.HAS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\proton-ip-scanner.exe
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:Path += ";C:\Program Files (x86)\NSIS" }
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location packaging\windows
          makensis /DVERSION=$v /DEXE=..\..\target\release\proton-ip-scanner.exe /DOUTDIR=..\..\out installer.nsi
          Pop-Location
          Copy-Item target\release\proton-ip-scanner.exe "out\proton-ip-scanner-$v-windows-portable.exe"
      - name: Sign the installer (optional)
        if: env.HAS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem out\*Setup.exe | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --title "Proton IP Scanner ${tag#v}" --generate-notes
          fi
