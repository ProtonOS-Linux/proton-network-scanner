# Tests every push and pull request on Linux and Windows.
#
# Releasing: bump `version` in Cargo.toml and push to main. When main has a
# version that has no GitHub release yet (or a v* tag is pushed), this workflow
# builds the release files, creates the tag v<version> and publishes the release:
#
#   proton-ip-scanner_<version>-1_amd64.deb          Debian/Ubuntu package (glibc 2.30+)
#   proton-ip-scanner-<version>-linux-x86_64.tar.gz  plain Linux binary
#   ProtonIPScanner-<version>-Setup.exe              Windows installer
#   proton-ip-scanner-<version>-windows-portable.exe Windows, no installation
#   SHA256SUMS.txt
#
# The Proton OS APT repository (github.com/ProtonOS-Linux/apt) picks up the .deb
# from the release within an hour, so Proton OS computers get the update through
# KDE Discover / apt.
#
# Optional Windows code signing (removes the SmartScreen "unknown publisher"
# warning once the certificate has reputation): add the repository secrets
# WINDOWS_CERT_PFX (base64 of a .pfx code-signing certificate) and
# WINDOWS_CERT_PASSWORD. Without them, the files are built unsigned.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # Checks the AppStream and desktop files. A broken metainfo file would make the app
  # disappear from KDE Discover, so a release is never built with one.
  metadata:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Validate AppStream and desktop entry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli validate --no-net packaging/org.protonos.ProtonIpScanner.metainfo.xml
          desktop-file-validate packaging/org.protonos.ProtonIpScanner.desktop

  # Builds the Flatpak the way Flathub does (org.flatpak.Builder, offline build) from the code
  # in this push, runs Flathub's linter on the manifest and the result, and uploads a
  # .flatpak bundle for testing (Actions run page → Artifacts; install it with
  # `flatpak install --user proton-ip-scanner.flatpak`).
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cargo-sources.json matches Cargo.lock
        run: |
          # Flathub builds offline from this list; a stale list fails there. Regenerate with
          # the steps in docs/FLATPAK.md when this fails.
          git clone -q --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/fbt"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install 'aiohttp>=3.9.5,<4' 'PyYAML>=6,<7' 'tomlkit>=0.13.3,<1'
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fbt/cargo/flatpak-cargo-generator.py" \
            Cargo.lock -o "$RUNNER_TEMP/cargo-sources.json"
          diff -q "$RUNNER_TEMP/cargo-sources.json" packaging/flatpak/cargo-sources.json
      - name: Install Flatpak and Flathub's builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak dbus
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Build from this commit
        run: |
          # Same manifest as the one submitted to Flathub, but built from this checkout
          # instead of the release tag.
          python3 - <<'PY'
          import re
          src = open("packaging/flatpak/org.protonos.ProtonIpScanner.yml").read()
          git = re.compile(r"      - type: git\n(        .*\n)+")
          assert git.search(src), "git source not found in the manifest"
          out = git.sub("      - type: dir\n        path: .\n", src, count=1)
          # Sandboxed builds only read files below the manifest, so this copy sits at the top.
          out = out.replace("      - cargo-sources.json\n", "      - packaging/flatpak/cargo-sources.json\n")
          open("ci-flatpak.yml", "w").write(out)
          PY
          # dbus-run-session: the runner has no desktop session, which flatpak needs to install deps.
          dbus-run-session flatpak run org.flatpak.Builder --user --force-clean --sandbox --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=repo --default-branch=test builddir ci-flatpak.yml
          flatpak build-bundle repo proton-ip-scanner.flatpak org.protonos.ProtonIpScanner test
      - name: Flathub linter
        run: |
          lint() { dbus-run-session flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          lint manifest packaging/flatpak/org.protonos.ProtonIpScanner.yml
          lint appstream builddir/files/share/metainfo/org.protonos.ProtonIpScanner.metainfo.xml
          # The repo check also wants screenshots mirrored and the app published, which only
          # Flathub's own build does, so its result is shown but does not fail this job.
          lint repo repo || echo "repo lint: see above (screenshot mirroring is done by Flathub)"
      - name: Start in the sandbox
        run: |
          flatpak install --user -y --noninteractive ./proton-ip-scanner.flatpak
          dbus-run-session flatpak run org.protonos.ProtonIpScanner --help
          # Unprivileged ping depends on the kernel setting below (it must include the user's
          # group). Shown outside and inside the sandbox so a ping fallback is easy to explain.
          echo "ping_group_range outside: $(cat /proc/sys/net/ipv4/ping_group_range), id: $(id -g)"
          dbus-run-session flatpak run --command=sh org.protonos.ProtonIpScanner -c \
            'echo "ping_group_range inside: $(cat /proc/sys/net/ipv4/ping_group_range), id: $(id -g)"'
          # A real scan of this runner's own address, inside the sandbox.
          dbus-run-session flatpak run org.protonos.ProtonIpScanner --scan 127.0.0.1 --ports 22,80 --csv
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: proton-ip-scanner.flatpak

  # Decides whether this run publishes a release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ] \
               && ! gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release=true   # new version on main without a release yet
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release"

  linux:
    if: needs.version.outputs.release == 'true'
    needs: [test, audit, metadata, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Tools
        run: |
          pip install ziglang
          cargo install cargo-zigbuild cargo-deb --locked
      - name: Build against glibc 2.30 (runs on Debian 11+, Ubuntu 20.04+)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
      - name: Package
        run: |
          set -eu
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo deb --target x86_64-unknown-linux-gnu --no-build
          mkdir -p out
          cp target/debian/*.deb out/ 2>/dev/null || cp target/x86_64-unknown-linux-gnu/debian/*.deb out/
          tar -C target/x86_64-unknown-linux-gnu/release -czf "out/proton-ip-scanner-$v-linux-x86_64.tar.gz" proton-ip-scanner
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    if: needs.version.outputs.release == 'true'
    needs: [test, audit, version]
    runs-on: windows-latest
    env:
      # Secrets cannot be used in `if:` directly; expose only whether one exists.
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Sign the program (optional)
        if: env.HAS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\proton-ip-scanner.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/release/proton-ip-scanner.exe

  # The installer is built on Linux: Debian's NSIS includes the 64-bit
  # installer stubs (the Windows NSIS package does not).
  installer:
    needs: [windows, version]
    runs-on: ubuntu-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: exe
      - name: Build the installer
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis osslsigncode
          v="${{ needs.version.outputs.version }}"
          mkdir -p out
          (cd packaging/windows && makensis -V2 -DVERSION="$v" -DEXE="$GITHUB_WORKSPACE/exe/proton-ip-scanner.exe" -DOUTDIR="$GITHUB_WORKSPACE/out" installer.nsi)
          cp exe/proton-ip-scanner.exe "out/proton-ip-scanner-$v-windows-portable.exe"
      - name: Sign the installer (optional)
        if: env.HAS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -eu
          echo "$WINDOWS_CERT_PFX" | base64 -d > cert.pfx
          for f in out/*Setup.exe; do
            osslsigncode sign -pkcs12 cert.pfx -pass "$WINDOWS_CERT_PASSWORD" -h sha256 \
              -t http://timestamp.digicert.com -in "$f" -out "$f.signed" && mv "$f.signed" "$f"
          done
          rm -f cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    if: needs.version.outputs.release == 'true'
    needs: [linux, installer, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{linux,windows}"
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            # Notes: this version's section of CHANGELOG.md, plus install help.
            awk -v v="${tag#v}" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' "$GITHUB_WORKSPACE/CHANGELOG.md" > notes.md || true
            cat "$GITHUB_WORKSPACE/.github/release-notes-footer.md" >> notes.md
            gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Proton IP Scanner ${tag#v}" --notes-file notes.md
          fi
